name: Build EasyTier FFI Libraries

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "EasyTier git ref, e.g. main, develop, v2.6.4"
        required: false
        default: ""
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  EASYTIER_REPO: https://github.com/easytier/easytier.git
  EASYTIER_DIR: easytier-src
  RUST_TOOLCHAIN: "1.95"

defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Check for new EasyTier version
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve source ref
        id: resolve
        run: |
          if [ -n "${{ inputs.source_ref }}" ]; then
            echo "source_ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Using manual ref: ${{ inputs.source_ref }}"
            exit 0
          fi

          LATEST_TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/easytier/easytier/releases/latest | jq -r .tag_name)

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to get latest release tag"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest EasyTier release: $LATEST_TAG"

          if git rev-parse "refs/tags/${LATEST_TAG}" >/dev/null 2>&1; then
            echo "Version $LATEST_TAG already built, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: $LATEST_TAG"
            echo "source_ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-ffi:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: windows-amd64
            platform: windows
            arch: x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ffi_lib: easytier_ffi.dll

          - artifact_name: windows-x86
            platform: windows
            arch: x86
            os: windows-latest
            target: i686-pc-windows-msvc
            ffi_lib: easytier_ffi.dll

          - artifact_name: linux-amd64
            platform: linux
            arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ffi_lib: libeasytier_ffi.so

          - artifact_name: linux-x86
            platform: linux
            arch: x86
            os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            cross_packages: gcc-multilib
            ffi_lib: libeasytier_ffi.so

          - artifact_name: linux-armv7
            platform: linux
            arch: armv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            cross_packages: gcc-arm-linux-gnueabihf
            cross_linker: arm-linux-gnueabihf-gcc
            ffi_lib: libeasytier_ffi.so

          - artifact_name: linux-aarch64
            platform: linux
            arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ffi_lib: libeasytier_ffi.so

          - artifact_name: linux-riscv64
            platform: linux
            arch: riscv64
            os: ubuntu-22.04
            target: riscv64gc-unknown-linux-gnu
            cross_packages: gcc-riscv64-linux-gnu
            cross_linker: riscv64-linux-gnu-gcc
            ffi_lib: libeasytier_ffi.so

          - artifact_name: macos-amd64
            platform: macos
            arch: x86_64
            os: macos-14
            target: x86_64-apple-darwin
            ffi_lib: libeasytier_ffi.dylib

          - artifact_name: macos-aarch64
            platform: macos
            arch: aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ffi_lib: libeasytier_ffi.dylib

          - artifact_name: android-aarch64
            platform: android
            arch: aarch64
            os: ubuntu-22.04
            target: aarch64-linux-android
            ndk_target: arm64-v8a
            ffi_lib: libeasytier_ffi.so

          - artifact_name: android-armv7
            platform: android
            arch: armv7
            os: ubuntu-22.04
            target: armv7-linux-androideabi
            ndk_target: armeabi-v7a
            ffi_lib: libeasytier_ffi.so

          - artifact_name: android-x86
            platform: android
            arch: x86
            os: ubuntu-22.04
            target: i686-linux-android
            ndk_target: x86
            ffi_lib: libeasytier_ffi.so

          - artifact_name: android-x86_64
            platform: android
            arch: x86_64
            os: ubuntu-22.04
            target: x86_64-linux-android
            ndk_target: x86_64
            ffi_lib: libeasytier_ffi.so

    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang llvm lld mold

      - name: Install Linux cross-compilation toolchain
        if: matrix.cross_packages != ''
        run: |
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Set cross-compilation linker
        if: matrix.cross_linker != ''
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        if: matrix.ndk_target != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        if: matrix.ndk_target != ''
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Install cargo-ndk (Android)
        if: matrix.ndk_target != ''
        run: cargo install cargo-ndk

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Clone EasyTier source
        run: |
          git init "$EASYTIER_DIR"
          cd "$EASYTIER_DIR"
          git remote add origin "$EASYTIER_REPO"
          git fetch --depth=1 origin "${{ needs.check-version.outputs.source_ref }}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Read source version
        id: source-info
        working-directory: ${{ env.EASYTIER_DIR }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' easytier/Cargo.toml | head -n 1)
          COMMIT=$(git rev-parse HEAD)
          echo "source_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "EasyTier version: $VERSION"
          echo "EasyTier commit: $COMMIT"

      - name: Build FFI cdylib
        working-directory: ${{ env.EASYTIER_DIR }}
        if: matrix.ndk_target == ''
        run: |
          cargo build --release --target ${{ matrix.target }} --package easytier-ffi

      - name: Build Android FFI
        working-directory: ${{ env.EASYTIER_DIR }}
        if: matrix.ndk_target != ''
        run: |
          cd easytier-contrib/easytier-ffi
          cargo ndk -t ${{ matrix.ndk_target }} build --release

      - name: Package artifact
        working-directory: ${{ env.EASYTIER_DIR }}
        run: |
          ARTIFACT_NAME="easytier-ffi-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.check-version.outputs.source_ref }}"
          OUT_DIR="../artifacts/$ARTIFACT_NAME"
          BUILD_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$OUT_DIR"
          cp "$BUILD_DIR/${{ matrix.ffi_lib }}" "$OUT_DIR/"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$OUT_DIR/${{ matrix.ffi_lib }}" | awk '{print $1}' > "$OUT_DIR/${{ matrix.ffi_lib }}.sha256"
          else
            shasum -a 256 "$OUT_DIR/${{ matrix.ffi_lib }}" | awk '{print $1}' > "$OUT_DIR/${{ matrix.ffi_lib }}.sha256"
          fi
          {
            echo "source_repo=$EASYTIER_REPO"
            echo "source_ref=${{ needs.check-version.outputs.source_ref }}"
            echo "source_version=${{ steps.source-info.outputs.source_version }}"
            echo "source_commit=${{ steps.source-info.outputs.source_commit }}"
            echo "target=${{ matrix.target }}"
          } > "$OUT_DIR/BUILD_INFO.txt"
          cd ../artifacts
          tar -czf "${ARTIFACT_NAME}.tar.gz" "$ARTIFACT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-ffi-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.check-version.outputs.source_ref }}
          path: artifacts/easytier-ffi-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.check-version.outputs.source_ref }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: [check-version, build-ffi]
    if: success() && needs.check-version.outputs.should_build == 'true' && startsWith(needs.check-version.outputs.source_ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: easytier-ffi-*

      - name: Flatten artifacts
        run: |
          find artifacts -mindepth 2 -name "*.tar.gz" -exec mv {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.source_ref }}
          name: ${{ needs.check-version.outputs.source_ref }}
          files: artifacts/*.tar.gz
          generate_release_notes: true